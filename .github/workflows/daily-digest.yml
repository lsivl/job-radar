name: Daily Job Digest

on:
  schedule:
    # 05:00 UTC = 07:00 Europe/Warsaw (06:00 during CET winter time — close enough for a morning digest)
    - cron: "0 5 * * *"
  workflow_dispatch: {} # manual "Run workflow" button for testing

permissions:
  contents: write # needed to commit today's snapshot back into the repo

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan -> diff -> score -> digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REMOTEROCKETSHIP_API_KEY: ${{ secrets.REMOTEROCKETSHIP_API_KEY }}
        run: python scan.py

      - name: Commit today's snapshot
        run: |
          git config user.name "job-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add snapshots/
          git diff --cached --quiet && echo "No snapshot changes" || git commit -m "snapshot $(date -u +%Y-%m-%d)"
          git push

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ job-radar workflow failed — check the Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
