# Target companies to monitor daily.
#
# Each entry needs:
#   name: Display name
#   source: ATS platform (greenhouse | lever | ashby | workable)
#   slug: Board token / company slug on that ATS
#   tier: 1 = dream, 2 = strong, 3 = watch
#
# How to find the slug: look at a company's careers page URL.
#   boards.greenhouse.io/monzo        -> source: greenhouse, slug: monzo
